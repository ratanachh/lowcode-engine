name: Check Base Branch

on:
  pull_request:
    types: [opened]

jobs:
  code-review:
    name: Check
    runs-on: ubuntu-latest

    steps:
      # Check whether the user has write permission on the repository
      - name: 'Check User Permission'
        uses: 'lannonbr/repo-permission-check-action@2.0.0'
        with:
          permission: 'write'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Check base branch name is develop or not'
        if: github.event.pull_request.base.ref != 'develop'   # check the target branch if it's master
        uses: actions-cool/issues-helper@v2
        with:
          actions: 'create-comment'
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Thanks for your PR. According to the [Contribution Guideline](https://lowcode-engine.cn/site/docs/participate/flow), please set the base branch to **develop**.

            @${{ github.event.pull_request.user.login }}